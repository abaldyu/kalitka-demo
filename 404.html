<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Страница не найдена — Калитка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F0E6;--ink:#2A211B;--ink-2:#6B5D52;--acc:#A8322B;--acc-ink:#fff;--line:#E2D6C4}
@media (prefers-color-scheme:dark){:root{--bg:#1C1714;--ink:#EDE4D8;--ink-2:#B8A999;--acc:#D9574D;--line:#3A312A}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:clip}
body{background:var(--bg);color:var(--ink);font:16px/1.65 Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2{font-family:"Playfair Display",Georgia,serif;font-weight:700;line-height:1.1;text-wrap:balance}
a{color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:48px 20px 64px}
.btn{display:inline-flex;align-items:center;min-height:48px;padding:0 24px;border-radius:8px;background:var(--acc);color:var(--acc-ink);text-decoration:none;font-weight:700}
.btn:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
<style>
main{min-height:100svh;display:grid;place-items:center;text-align:center;padding:24px}
.code{font-family:"Playfair Display",Georgia,serif;font-size:clamp(96px,30vw,180px);line-height:1;color:var(--acc)}
h1{font-size:clamp(28px,7vw,44px);margin:12px 0}
p{color:var(--ink-2);margin-bottom:28px}
</style>
</head>
<body>
<main><div>
  <div class="code">404</div>
  <h1>Похоже, эту калитку уже съели</h1>
  <p>Такой страницы нет. Зато есть свежая выпечка и меню.</p>
  <a class="btn" href="https://abaldyu.github.io/kalitka-demo/">На главную</a>
</div></main>
</body>
</html>
